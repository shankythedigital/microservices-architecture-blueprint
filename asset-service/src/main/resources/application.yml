# Asset-service (cloud-cloud)
server:
  port: ${PORT:7075}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:7071}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:7072}/api/notifications

asset:
  service:
    url: ${ASSET_SERVICE_URL:http://localhost:7075}
  upload:
    dir: uploads/amc-docs
    supabase:
      enabled: false
      url: ${SUPABASE_IMAGES_URL:}
      service-role-key: ${SUPABASE_IMAGES_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_IMAGES_BUCKET:}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:asset-service}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 300000
      connection-timeout: 20000
      keepalive-time: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: "${ASSET_DB_SCHEMA:assetdb}"
        hbm2ddl:
          create_namespaces: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:7071}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:7072}

security:
  jwt:
    public-key-path: classpath:keys/jwt-public.pem
    issuer: ${issuer:auth-service}
    audience: ${asset_audience:asset-service}

common:
  notification:
    enabled: true

JWT_PUBLIC_KEY_PATH: classpath:keys/jwt-public.pem
JWT_SECRET: ${JWT_SECRET:yNnC7M3ZqgV4bD0lFJm9Q2w5tSe8XpR1pWc7UjK4oHs=}
AUTH_ENC_KEY: ${AUTH_ENC_KEY:SLOqKf8lS2hidTDsXQe25ZSaoaGcczUX6gySXUxjE1M=}
AUTH_HMAC_KEY: ${AUTH_HMAC_KEY:krFcA7/MYPXQWbtSGMM87Dzxu2euOsRckVFeUyOC6dw=}
AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:http://localhost:7071}
NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:http://localhost:7072}


logging:
  level:
    com.example: DEBUG
# Tesseract OCR Configuration
tesseract:
  enabled: true
  use-process: true
  data-path: /opt/local/share/tessdata
  executable-path: /opt/local/bin/tesseract
  language: eng
  page-seg-mode: 1
  ocr-engine-mode: 1

# LLM / Agentic AI for document extraction
app:
  llm:
    enabled: true
    api-url: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    max-tokens: 4096
    timeout-seconds: 60


# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  group-configs:
    - group: 'asset-service'
      display-name: 'Asset Service API'
      paths-to-match: '/api/**'
