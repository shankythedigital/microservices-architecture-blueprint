# Asset-service (local)
server:
  port: 7075

auth:
  service:
    url: http://localhost:7071

notification:
  service:
    url: http://localhost:7072/api/notifications

asset:
  service:
    url: http://localhost:7075
  upload:
    dir: uploads/amc-docs
    supabase:
      enabled: false
      url: 
      service-role-key: 
      bucket: 

spring:
  application:
    name: asset-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 300000
      connection-timeout: 20000
      keepalive-time: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: "assetdb"
        hbm2ddl:
          create_namespaces: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

services:
  auth:
    base-url: http://localhost:7071
  notification:
    base-url: http://localhost:7072

security:
  jwt:
    public-key-path: classpath:keys/jwt-public.pem
    issuer: auth-service
    audience: asset-service

common:
  notification:
    enabled: true

JWT_PUBLIC_KEY_PATH: classpath:keys/jwt-public.pem
