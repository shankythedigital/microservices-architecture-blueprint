AUTH_SERVICE_URL: http://localhost:7071
NOTIFICATION_SERVICE_URL: http://localhost:7072


logging:
  level:
    com.example: DEBUG
# Tesseract OCR Configuration
tesseract:
  enabled: true
  use-process: true
  data-path: /opt/local/share/tessdata
  executable-path: /opt/local/bin/tesseract
  language: eng
  page-seg-mode: 1
  ocr-engine-mode: 1

# LLM / Agentic AI for document extraction
app:
  llm:
    enabled: true
    api-url: https://api.openai.com/v1
    api-key: ""
    model: gpt-4o-mini
    max-tokens: 4096
    timeout-seconds: 60


# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  group-configs:
    - group: 'asset-service'
      display-name: 'Asset Service API'
      paths-to-match: '/api/**'
