  upload:
    # Upload directory - use relative path (project/uploads/amc-docs) or absolute path
    # If the configured path is not writable, the code will fallback to project/uploads/amc-docs
    dir: uploads/amc-docs

spring:
  application:
    name: asset-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:postgresql://db.sefwxyysecmfeawhvlbu.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: BYQnqzYByLGv1DtF 
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 300000   # 5 min - recycle before server closes (avoids "connection closed" validation failures)
      connection-timeout: 20000
      keepalive-time: 60000   # 1 min - keep connections alive during long operations
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # Keep app tables out of Supabase's reserved  schema (search_path / metadata clashes).
        default_schema: assetdb
        hbm2ddl:
          create_namespaces: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

