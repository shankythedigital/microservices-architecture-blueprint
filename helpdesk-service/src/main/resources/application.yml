# Helpdesk-service (cloud-local)
server:
  port: ${PORT:8084}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}/api/notifications

asset:
  service:
    url: ${ASSET_SERVICE_URL:http://localhost:8085}

helpdesk:
  service:
    url: ${HELPDESK_SERVICE_URL:http://localhost:8084}
  chatbot:
    enabled: true
    max-context-length: 1000

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:helpdesk-service}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: HelpdeskHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${HELPDESK_DB_SCHEMA:helpdeskdb}
        hbm2ddl:
          create_namespaces: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
  asset:
    base-url: ${ASSET_SERVICE_URL:http://localhost:8085}

security:
  jwt:
    public-key-path: classpath:keys/jwt-public.pem
    issuer: ${issuer:auth-service}
    audience: ${helpdesk_audience:helpdesk-service}

common:
  notification:
    enabled: true

JWT_PUBLIC_KEY_PATH: classpath:keys/jwt-public.pem
JWT_SECRET: ${JWT_SECRET:yNnC7M3ZqgV4bD0lFJm9Q2w5tSe8XpR1pWc7UjK4oHs=}
AUTH_ENC_KEY: ${AUTH_ENC_KEY:SLOqKf8lS2hidTDsXQe25ZSaoaGcczUX6gySXUxjE1M=}
AUTH_HMAC_KEY: ${AUTH_HMAC_KEY:krFcA7/MYPXQWbtSGMM87Dzxu2euOsRckVFeUyOC6dw=}
AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:http://localhost:8081}
NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
ASSET_SERVICE_URL: ${ASSET_SERVICE_URL:http://localhost:8085}

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  group-configs:
    - group: 'helpdesk-service'
      display-name: 'Helpdesk Service API'
      paths-to-match: '/api/**'
