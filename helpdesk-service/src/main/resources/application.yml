# Helpdesk-service
server:
  port: ${PORT}

auth:
  service:
    url: ${AUTH_SERVICE_URL}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL}/api/notifications

asset:
  service:
    url: ${ASSET_SERVICE_URL}

helpdesk:
  service:
    url: ${HELPDESK_SERVICE_URL}
  chatbot:
    enabled: true
    max-context-length: 1000

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: HelpdeskHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Keep app tables out of Supabase's reserved  schema (search_path / metadata clashes).
        default_schema: ${HELPDESK_DB_SCHEMA}
        hbm2ddl:
          create_namespaces: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

services:
  auth:
    base-url: ${AUTH_SERVICE_URL}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL}
  asset:
    base-url: ${ASSET_SERVICE_URL}

security:
  jwt:
    public-key-path: classpath:keys/jwt-public.pem
    issuer: ${issuer}
    audience: ${helpdesk_audience}

common:
  notification:
    enabled: true

