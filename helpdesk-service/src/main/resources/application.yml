# Helpdesk-service
microservice:
  ports:
    auth: ${AUTH_SERVICE_PORT:8081}
    notification: ${NOTIFICATION_SERVICE_PORT:8082}
    asset: ${ASSET_SERVICE_PORT:8085}
    helpdesk: ${HELPDESK_SERVICE_PORT:8084}

server:
  port: ${microservice.ports.helpdesk}

auth:
  service:
    url: http://localhost:${microservice.ports.auth}

notification:
  service:
    url: http://localhost:${microservice.ports.notification}/api/notifications

asset:
  service:
    url: http://localhost:${microservice.ports.asset}

helpdesk:
  service:
    url: http://localhost:${microservice.ports.helpdesk}
  chatbot:
    enabled: true
    max-context-length: 1000

spring:
  application:
    name: helpdesk-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:mysql://localhost:3306/helpdeskdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Snmysql@1110
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: HelpdeskHikariPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

services:
  auth:
    base-url: http://localhost:${microservice.ports.auth}
  notification:
    base-url: http://localhost:${microservice.ports.notification}
  asset:
    base-url: http://localhost:${microservice.ports.asset}

security:
  jwt:
    public-key-path: classpath:keys/jwt-public.pem
    issuer: "auth-service"
    audience: "helpdesk-service"

common:
  notification:
    enabled: true

JWT_PUBLIC_KEY_PATH: classpath:keys/jwt-public.pem
JWT_SECRET: yNnC7M3ZqgV4bD0lFJm9Q2w5tSe8XpR1pWc7UjK4oHs=
AUTH_ENC_KEY: SLOqKf8lS2hidTDsXQe25ZSaoaGcczUX6gySXUxjE1M=
AUTH_HMAC_KEY: krFcA7/MYPXQWbtSGMM87Dzxu2euOsRckVFeUyOC6dw=
AUTH_SERVICE_URL: http://localhost:${microservice.ports.auth}
NOTIFICATION_SERVICE_URL: http://localhost:${microservice.ports.notification}
ASSET_SERVICE_URL: http://localhost:${microservice.ports.asset}

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  group-configs:
    - group: 'helpdesk-service'
      display-name: 'Helpdesk Service API'
      paths-to-match: '/api/**'
