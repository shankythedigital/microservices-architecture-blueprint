# Helpdesk-service
server:
  port: 8084

auth:
  service:
    url: https://auth-service-ddhb.onrender.com:8080

notification:
  service:
    url: http://194.163.173.37:8082/api/notifications

asset:
  service:
    url: http://194.163.173.37:8085

helpdesk:
  service:
    url: http://194.163.173.37:8084
  chatbot:
    enabled: true
    max-context-length: 1000

spring:
  application:
    name: helpdesk-service  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:postgresql://db.sefwxyysecmfeawhvlbu.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: BYQnqzYByLGv1DtF
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: HelpdeskHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # Keep app tables out of Supabase's reserved  schema (search_path / metadata clashes).
        default_schema: helpdeskdb
        hbm2ddl:
          create_namespaces: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

services:
  auth:
    base-url: https://auth-service-ddhb.onrender.com:8080
  notification:
    base-url: http://194.163.173.37:8082
  asset:
    base-url: http://194.163.173.37:8085

security:
  jwt:
    public-key-path: classpath:keys/jwt-public.pem
    issuer: "auth-service"
    audience: "helpdesk-service"

common:
  notification:
    enabled: true

