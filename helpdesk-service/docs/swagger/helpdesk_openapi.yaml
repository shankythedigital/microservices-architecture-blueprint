  # ============================================================
  # ESCALATION MATRIX ENDPOINTS
  # ============================================================
  /api/helpdesk/escalation-matrix:
    post:
      tags:
        - Escalation Matrix
      summary: Create escalation matrix
      description: Create a new escalation matrix entry with SLA configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationMatrixRequest'
      responses:
        '201':
          description: Escalation matrix created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationMatrixResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

    get:
      tags:
        - Escalation Matrix
      summary: Get all escalation matrices
      description: Retrieve all escalation matrix configurations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of escalation matrices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscalationMatrixResponse'

  /api/helpdesk/escalation-matrix/{id}:
    get:
      tags:
        - Escalation Matrix
      summary: Get escalation matrix by ID
      description: Retrieve a specific escalation matrix by its ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Escalation matrix found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationMatrixResponse'
        '404':
          description: Escalation matrix not found

    put:
      tags:
        - Escalation Matrix
      summary: Update escalation matrix
      description: Update an existing escalation matrix
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationMatrixRequest'
      responses:
        '200':
          description: Escalation matrix updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationMatrixResponse'
        '404':
          description: Escalation matrix not found

    delete:
      tags:
        - Escalation Matrix
      summary: Delete escalation matrix
      description: Delete an escalation matrix
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Escalation matrix deleted
        '404':
          description: Escalation matrix not found

  /api/helpdesk/escalation-matrix/service/{service}:
    get:
      tags:
        - Escalation Matrix
      summary: Get escalation matrices by service
      description: Retrieve escalation matrices for a specific service
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RelatedService'
      responses:
        '200':
          description: List of escalation matrices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscalationMatrixResponse'

  /api/helpdesk/escalation-matrix/service/{service}/priority/{priority}:
    get:
      tags:
        - Escalation Matrix
      summary: Get escalation matrix
      description: Get active escalation matrix for service and priority
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RelatedService'
        - name: priority
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IssuePriority'
      responses:
        '200':
          description: Escalation matrix found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationMatrixResponse'
        '404':
          description: Escalation matrix not found

  # ============================================================
  # ESCALATION ENDPOINTS
  # ============================================================
  /api/helpdesk/escalations/issue/{issueId}:
    post:
      tags:
        - Issue Escalation
      summary: Escalate issue
      description: Manually escalate an issue to a higher support level
      security:
        - bearerAuth: []
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueEscalationRequest'
      responses:
        '200':
          description: Issue escalated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueEscalationResponse'
        '401':
          description: Unauthorized
        '404':
          description: Issue not found

    get:
      tags:
        - Issue Escalation
      summary: Get issue escalations
      description: Retrieve escalation history for an issue
      security:
        - bearerAuth: []
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of escalations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueEscalationResponse'
        '404':
          description: Issue not found

  /api/helpdesk/escalations/issue/{issueId}/auto-escalate:
    post:
      tags:
        - Issue Escalation
      summary: Auto-escalate issue
      description: Trigger auto-escalation check for an issue
      security:
        - bearerAuth: []
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Auto-escalation triggered
        '404':
          description: Issue not found

  # ============================================================
  # SLA ENDPOINTS
  # ============================================================
  /api/helpdesk/sla/issue/{issueId}:
    get:
      tags:
        - SLA Tracking
      summary: Get SLA tracking
      description: Retrieve SLA tracking information for an issue
      security:
        - bearerAuth: []
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: SLA tracking information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLATrackingResponse'
        '404':
          description: Issue not found

  /api/helpdesk/sla/breaches:
    get:
      tags:
        - SLA Tracking
      summary: Get SLA breaches
      description: Retrieve all issues with SLA breaches
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of SLA breaches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SLATrackingResponse'

  /api/helpdesk/sla/issue/{issueId}/first-response:
    post:
      tags:
        - SLA Tracking
      summary: Record first response
      description: Record the first response time for an issue
      security:
        - bearerAuth: []
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: First response recorded
        '404':
          description: Issue not found

  # ============================================================
  # SERVICE KNOWLEDGE ENDPOINTS
  # ============================================================
  /api/helpdesk/knowledge:
    post:
      tags:
        - Service Knowledge
      summary: Create knowledge entry
      description: Add new knowledge about a service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceKnowledgeRequest'
      responses:
        '201':
          description: Knowledge entry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKnowledgeResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

    get:
      tags:
        - Service Knowledge
      summary: Get all knowledge
      description: Retrieve all knowledge entries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of knowledge entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceKnowledgeResponse'

  /api/helpdesk/knowledge/{id}:
    get:
      tags:
        - Service Knowledge
      summary: Get knowledge by ID
      description: Retrieve a specific knowledge entry by its ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Knowledge entry found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKnowledgeResponse'
        '404':
          description: Knowledge entry not found

    put:
      tags:
        - Service Knowledge
      summary: Update knowledge
      description: Update an existing knowledge entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceKnowledgeRequest'
      responses:
        '200':
          description: Knowledge entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKnowledgeResponse'
        '404':
          description: Knowledge entry not found

    delete:
      tags:
        - Service Knowledge
      summary: Delete knowledge
      description: Delete a knowledge entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Knowledge entry deleted
        '404':
          description: Knowledge entry not found

  /api/helpdesk/knowledge/service/{service}:
    get:
      tags:
        - Service Knowledge
      summary: Get knowledge by service
      description: Retrieve knowledge entries filtered by service
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RelatedService'
      responses:
        '200':
          description: List of knowledge entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceKnowledgeResponse'

  /api/helpdesk/knowledge/service/{service}/search:
    get:
      tags:
        - Service Knowledge
      summary: Search knowledge
      description: Search knowledge entries by service and keyword
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RelatedService'
        - name: keyword
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of matching knowledge entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceKnowledgeResponse'

  # ============================================================
  # CHATBOT ENDPOINTS
  # ============================================================
  /api/helpdesk/chatbot/message:
    post:
      tags:
        - Chatbot
      summary: Send message to chatbot
      description: Send a message to the chatbot and get a response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotMessageRequest'
      responses:
        '200':
          description: Chatbot response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotMessageResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /api/helpdesk/chatbot/session/{sessionId}:
    get:
      tags:
        - Chatbot
      summary: Get session history
      description: Retrieve conversation history for a chatbot session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatbotMessageResponse'
        '404':
          description: Session not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ResponseWrapper:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

    IssueStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, REOPENED]

    QueryStatus:
      type: string
      enum: [PENDING, ANSWERED, CLOSED]

    RelatedService:
      type: string
      enum: [AUTH_SERVICE, NOTIFICATION_SERVICE, ASSET_SERVICE, HELPDESK_SERVICE, UPCOMING_PROJECT]

    IssuePriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    SupportLevel:
      type: string
      enum: [L1, L2, L3]

    IssueRequest:
      type: object
      required:
        - priority
        - relatedService
      properties:
        issueMasterId:
          type: integer
          format: int64
          description: When raising ticket from issue master list - select from predefined issues
        title:
          type: string
          description: Required when not using issueMasterId (custom issue)
        description:
          type: string
          description: Required when not using issueMasterId. Optional override when using issueMasterId
        priority:
          $ref: '#/components/schemas/IssuePriority'
        relatedService:
          $ref: '#/components/schemas/RelatedService'
        assetId:
          type: integer
          format: int64
          description: Optional reference to asset master (asset_id)
        componentId:
          type: integer
          format: int64
          description: Optional reference to component master (component_id)
        sparePartId:
          type: integer
          format: int64
          description: Optional reference to spare parts master (spare_part_id)

    IssueResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/IssueStatus'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        relatedService:
          $ref: '#/components/schemas/RelatedService'
        reportedBy:
          type: string
          description: PII masked (DPDPA Compliance)
        assignedTo:
          type: string
          description: PII masked (DPDPA Compliance)
        currentSupportLevel:
          $ref: '#/components/schemas/SupportLevel'
        initialSupportLevel:
          $ref: '#/components/schemas/SupportLevel'
        assignedAt:
          type: string
          format: date-time
        firstResponseAt:
          type: string
          format: date-time
        resolution:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        escalationCount:
          type: integer
        lastEscalatedAt:
          type: string
          format: date-time
        assetId:
          type: integer
          format: int64
          description: Reference to asset master
        componentId:
          type: integer
          format: int64
          description: Reference to component master
        sparePartId:
          type: integer
          format: int64
          description: Reference to spare parts master
        issueMasterId:
          type: integer
          format: int64
          description: Reference to issue master when raised from list
        categoryId:
          type: integer
          format: int64
          description: Reference to category (from issue master)
        subCategoryId:
          type: integer
          format: int64
          description: Reference to subcategory (from issue master)
        slaTracking:
          $ref: '#/components/schemas/SLATrackingResponse'

    IssueMasterRequest:
      type: object
      required:
        - issueTitle
      properties:
        issueTitle:
          type: string
        issueDescription:
          type: string
        categoryId:
          type: integer
          format: int64
          description: Reference to category master (asset-service)
        subCategoryId:
          type: integer
          format: int64
          description: Reference to subcategory master (asset-service)
        componentId:
          type: integer
          format: int64
          description: Reference to component master (asset-service)
        sparePartId:
          type: integer
          format: int64
          description: Reference to spare parts master
    IssueMasterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        issueTitle:
          type: string
        issueDescription:
          type: string
        categoryId:
          type: integer
          format: int64
        subCategoryId:
          type: integer
          format: int64
        componentId:
          type: integer
          format: int64
        sparePartId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IssueResolutionRequest:
      type: object
      required:
        - resolution
      properties:
        resolution:
          type: string

    QueryRequest:
      type: object
      required:
        - question
        - relatedService
      properties:
        question:
          type: string
        relatedService:
          $ref: '#/components/schemas/RelatedService'

    QueryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        question:
          type: string
        answer:
          type: string
        status:
          $ref: '#/components/schemas/QueryStatus'
        relatedService:
          $ref: '#/components/schemas/RelatedService'
        askedBy:
          type: string
          description: PII masked (DPDPA Compliance)
        answeredBy:
          type: string
          description: PII masked (DPDPA Compliance)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        answeredAt:
          type: string
          format: date-time

    QueryAnswerRequest:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string

    FAQRequest:
      type: object
      required:
        - question
        - answer
        - relatedService
        - category
      properties:
        question:
          type: string
        answer:
          type: string
        relatedService:
          $ref: '#/components/schemas/RelatedService'
        category:
          type: string

    FAQResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        question:
          type: string
        answer:
          type: string
        relatedService:
          $ref: '#/components/schemas/RelatedService'
        category:
          type: string
        viewCount:
          type: integer
        helpfulCount:
          type: integer
        sequenceOrder:
          type: integer
        isFavourite:
          type: boolean
        isMostLike:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EscalationMatrixRequest:
      type: object
      required:
        - relatedService
        - priority
        - supportLevel
        - initialAssignmentLevel
        - responseTimeMinutes
        - resolutionTimeMinutes
      properties:
        relatedService:
          $ref: '#/components/schemas/RelatedService'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        supportLevel:
          $ref: '#/components/schemas/SupportLevel'
        initialAssignmentLevel:
          $ref: '#/components/schemas/SupportLevel'
        escalateToLevel:
          $ref: '#/components/schemas/SupportLevel'
        escalationTimeMinutes:
          type: integer
          description: Time before auto-escalation
        responseTimeMinutes:
          type: integer
          description: SLA response time
        resolutionTimeMinutes:
          type: integer
          description: SLA resolution time
        isActive:
          type: boolean
          default: true

    EscalationMatrixResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        relatedService:
          $ref: '#/components/schemas/RelatedService'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        supportLevel:
          $ref: '#/components/schemas/SupportLevel'
        initialAssignmentLevel:
          $ref: '#/components/schemas/SupportLevel'
        escalateToLevel:
          $ref: '#/components/schemas/SupportLevel'
        escalationTimeMinutes:
          type: integer
        responseTimeMinutes:
          type: integer
        resolutionTimeMinutes:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IssueEscalationRequest:
      type: object
      required:
        - toLevel
      properties:
        toLevel:
          $ref: '#/components/schemas/SupportLevel'
        escalationReason:
          type: string
          description: Optional reason for manual escalation

    IssueEscalationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        issueId:
          type: integer
          format: int64
        fromLevel:
          $ref: '#/components/schemas/SupportLevel'
        toLevel:
          $ref: '#/components/schemas/SupportLevel'
        escalatedAt:
          type: string
          format: date-time
        escalationReason:
          type: string
        escalatedBy:
          type: string
          description: PII masked (DPDPA Compliance)

    SLATrackingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        issueId:
          type: integer
          format: int64
        responseTimeMinutes:
          type: integer
        resolutionTimeMinutes:
          type: integer
        firstResponseAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        responseSLAMet:
          type: boolean
        resolutionSLAMet:
          type: boolean
        responseSLABreachAt:
          type: string
          format: date-time
        resolutionSLABreachAt:
          type: string
          format: date-time
        actualResponseTimeMinutes:
          type: integer
        actualResolutionTimeMinutes:
          type: integer

    ServiceKnowledgeRequest:
      type: object
      required:
        - service
        - topic
        - content
        - category
      properties:
        service:
          $ref: '#/components/schemas/RelatedService'
        topic:
          type: string
        content:
          type: string
        category:
          type: string
        apiEndpoints:
          type: string
        commonIssues:
          type: string
        troubleshootingSteps:
          type: string

    ServiceKnowledgeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        service:
          $ref: '#/components/schemas/RelatedService'
        topic:
          type: string
        content:
          type: string
        category:
          type: string
        apiEndpoints:
          type: string
        commonIssues:
          type: string
        troubleshootingSteps:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatbotMessageRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        sessionId:
          type: string
          description: Optional, for continuing conversation

    ChatbotMessageResponse:
      type: object
      properties:
        sessionId:
          type: string
        response:
          type: string
        conversationHistory:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        timestamp:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
        timestamp:
          type: string
          format: date-time
