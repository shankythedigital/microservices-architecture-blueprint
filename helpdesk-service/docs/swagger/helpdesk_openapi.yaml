            $ref: '#/components/schemas/QueryStatus'
      responses:
        '200':
          description: List of queries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueryResponse'

  /api/helpdesk/queries/service/{service}:
    get:
      tags:
        - Query Management
      summary: Get queries by service
      description: Retrieve queries filtered by related service
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RelatedService'
      responses:
        '200':
          description: List of queries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueryResponse'

  /api/helpdesk/queries/my-queries:
    get:
      tags:
        - Query Management
      summary: Get my queries
      description: Retrieve queries asked by the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of queries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueryResponse'

  /api/helpdesk/queries/{id}/answer:
    post:
      tags:
        - Query Management
      summary: Answer a query
      description: Provide an answer to a pending query
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryAnswerRequest'
      responses:
        '200':
          description: Query answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '404':
          description: Query not found

  /api/helpdesk/queries/{id}/close:
    patch:
      tags:
        - Query Management
      summary: Close query
      description: Close a query
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Query closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '404':
          description: Query not found

  # ============================================================
  # FAQ ENDPOINTS
  # ============================================================
  /api/helpdesk/faqs:
    post:
      tags:
        - FAQ Management
      summary: Create a new FAQ
      description: Add a new frequently asked question
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FAQRequest'
      responses:
        '201':
          description: FAQ created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAQResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

    get:
      tags:
        - FAQ Management
      summary: Get all FAQs
      description: Retrieve all FAQs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FAQResponse'

  /api/helpdesk/faqs/{id}:
    get:
      tags:
        - FAQ Management
      summary: Get FAQ by ID
      description: Retrieve a specific FAQ by its ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: FAQ found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAQResponse'
        '404':
          description: FAQ not found

    put:
      tags:
        - FAQ Management
      summary: Update FAQ
      description: Update an existing FAQ
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FAQRequest'
      responses:
        '200':
          description: FAQ updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAQResponse'
        '404':
          description: FAQ not found

    delete:
      tags:
        - FAQ Management
      summary: Delete FAQ
      description: Delete an FAQ
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: FAQ deleted
        '404':
          description: FAQ not found

  /api/helpdesk/faqs/service/{service}:
    get:
      tags:
        - FAQ Management
      summary: Get FAQs by service
      description: Retrieve FAQs filtered by related service
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RelatedService'
      responses:
        '200':
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FAQResponse'

  /api/helpdesk/faqs/category/{category}:
    get:
      tags:
        - FAQ Management
      summary: Get FAQs by category
      description: Retrieve FAQs filtered by category
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FAQResponse'

  /api/helpdesk/faqs/search:
    get:
      tags:
        - FAQ Management
      summary: Search FAQs
      description: Search FAQs by keyword
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of matching FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FAQResponse'

  /api/helpdesk/faqs/service/{service}/search:
    get:
      tags:
        - FAQ Management
      summary: Search FAQs by service
      description: Search FAQs by service and keyword
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RelatedService'
        - name: keyword
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of matching FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FAQResponse'

  /api/helpdesk/faqs/{id}/helpful:
    post:
      tags:
        - FAQ Management
      summary: Mark FAQ as helpful
      description: Increment the helpful count for an FAQ
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: FAQ marked as helpful
        '404':
          description: FAQ not found

  /api/helpdesk/faqs/{id}/favourite:
    put:
      tags:
        - FAQ Management
      summary: Update FAQ favourite status
      description: Toggle favourite status for an FAQ
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: isFavourite
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: FAQ favourite updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper'
        '404':
          description: FAQ not found

  /api/helpdesk/faqs/{id}/most-like:
    put:
      tags:
        - FAQ Management
      summary: Update FAQ most like status
      description: Toggle most like status for an FAQ
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: isMostLike
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: FAQ most like updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper'
        '404':
          description: FAQ not found

  /api/helpdesk/faqs/{id}/sequence-order:
    put:
      tags:
        - FAQ Management
      summary: Update FAQ sequence order
      description: Update the sequence order for an FAQ (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sequenceOrder
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: FAQ sequence order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWrapper'
        '404':
