openapi: 3.0.3
info:
  title: Helpdesk Service API
  description: |
    Helpdesk Service API
    
    Comprehensive helpdesk and support management including:
    - Issue and ticket management
    - Query management
    - FAQ management
    - Escalation matrix and SLA configuration
    - Issue escalation (manual and auto)
    - SLA tracking and breach monitoring
    - Service knowledge base
    - AI-powered chatbot integration
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8084
    description: Local development server
  - url: https://api.example.com/helpdesk-service
    description: Production server

tags:
  - name: Issue Management
    description: APIs for managing helpdesk issues and tickets
  - name: Issue Master
    description: Predefined issue types linked to category/subcategory/component/spare part
  - name: Query Management
    description: APIs for managing user queries
  - name: FAQ Management
    description: APIs for managing frequently asked questions
  - name: Escalation Matrix
    description: APIs for managing escalation matrix and SLA configuration
  - name: Issue Escalation
    description: APIs for managing issue escalations
  - name: SLA Tracking
    description: APIs for SLA tracking and monitoring
  - name: Service Knowledge
    description: APIs for managing service knowledge base
  - name: Chatbot
    description: APIs for chatbot interactions

paths:
  # ============================================================
  # ISSUE ENDPOINTS
  # ============================================================
  /api/helpdesk/issues:
    post:
      tags:
        - Issue Management
      summary: Create a new issue
      description: Raise a new issue ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '201':
          description: Issue created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

    get:
      tags:
        - Issue Management
      summary: Get all issues
      description: Retrieve all issues
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueResponse'
        '401':
          description: Unauthorized

  /api/helpdesk/issue-master:
    post:
      tags:
        - Issue Master
      summary: Create issue master
      description: Add new issue type when not in list. Select category, subcategory, component, or spare part from master tables. At least one ref required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueMasterRequest'
      responses:
        '201':
          description: Issue master created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMasterResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      tags:
        - Issue Master
      summary: List all issue masters
      description: Get all predefined issue types
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of issue masters
          content:
            application/json:
              type: array
              items:
                $ref: '#/components/schemas/IssueMasterResponse'
  /api/helpdesk/issue-master/category/{categoryId}:
    get:
      tags:
        - Issue Master
      summary: List by category
      description: Get issue masters linked to a category
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of issue masters
          content:
            application/json:
              type: array
              items:
                $ref: '#/components/schemas/IssueMasterResponse'
  /api/helpdesk/issue-master/sub-category/{subCategoryId}:
    get:
      tags:
        - Issue Master
      summary: List by subcategory
      description: Get issue masters linked to a subcategory
      security:
        - bearerAuth: []
      parameters:
        - name: subCategoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of issue masters
          content:
            application/json:
              type: array
              items:
                $ref: '#/components/schemas/IssueMasterResponse'
  /api/helpdesk/issue-master/component/{componentId}:
    get:
      tags:
        - Issue Master
      summary: List by component
      description: Get issue masters linked to a component
      security:
        - bearerAuth: []
      parameters:
        - name: componentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of issue masters
          content:
            application/json:
              type: array
              items:
                $ref: '#/components/schemas/IssueMasterResponse'
  /api/helpdesk/issue-master/{id}:
    get:
      tags:
        - Issue Master
      summary: Get issue master by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Issue master
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMasterResponse'
    put:
      tags:
        - Issue Master
      summary: Update issue master
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueMasterRequest'
      responses:
        '200':
          description: Updated issue master
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMasterResponse'

  /api/helpdesk/issues/{id}:
    get:
      tags:
        - Issue Management
      summary: Get issue by ID
      description: Retrieve a specific issue by its ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Issue found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '404':
          description: Issue not found
        '401':
          description: Unauthorized

    patch:
      tags:
        - Issue Management
      summary: Update issue status
      description: Update the status of an issue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/IssueStatus'
      responses:
        '200':
          description: Issue updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '404':
          description: Issue not found

  /api/helpdesk/issues/{id}/assign:
    patch:
      tags:
        - Issue Management
      summary: Assign issue
      description: Assign an issue to a support agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: assignedTo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Issue assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '404':
          description: Issue not found

  /api/helpdesk/issues/{id}/resolve:
    post:
      tags:
        - Issue Management
      summary: Resolve issue
      description: Resolve an issue with a resolution description
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueResolutionRequest'
      responses:
        '200':
          description: Issue resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '404':
          description: Issue not found

  /api/helpdesk/issues/{id}/close:
    patch:
      tags:
        - Issue Management
      summary: Close issue
      description: Close an issue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Issue closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '404':
          description: Issue not found

  /api/helpdesk/issues/status/{status}:
    get:
      tags:
        - Issue Management
      summary: Get issues by status
      description: Retrieve issues filtered by status
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IssueStatus'
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueResponse'

  /api/helpdesk/issues/service/{service}:
    get:
      tags:
        - Issue Management
      summary: Get issues by service
      description: Retrieve issues filtered by related service
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RelatedService'
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueResponse'

  /api/helpdesk/issues/my-issues:
    get:
      tags:
        - Issue Management
      summary: Get my issues
      description: Retrieve issues reported by the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueResponse'

  # ============================================================
  # QUERY ENDPOINTS
  # ============================================================
  /api/helpdesk/queries:
