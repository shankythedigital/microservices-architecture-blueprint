# Notification-service
server:
  port: 8082

notification:
  service:
    url: http://194.163.173.37:8082/api/notifications
  # When true and userId + Bearer token are present, skips sending if user opted out of that channel (auth-service).
  opt-out-check:
    enabled: true
  list:
    # Number of days to display notifications in notification icons
    # Default: 30 days (notifications older than 30 days will not be shown)
    display-days: 30
    # Maximum number of notifications to return (for pagination/performance)
    max-results: 100

asset:
  service:
    url: http://194.163.173.37:8085
  upload:
    dir: /asset-uploads/amc-docs

fileupload:
  type: standard

spring:
  application:
    name: notification-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:postgresql://db.sefwxyysecmfeawhvlbu.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: BYQnqzYByLGv1DtF
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # Keep app tables out of Supabase's reserved  schema (search_path / metadata clashes).
        default_schema: notificationdb
        hbm2ddl:
          create_namespaces: true

auth:
  service:
    url: https://auth-service-ddhb.onrender.com:8080/api/
  client-id: notification-service
  client-secret: notify-secret

notify:
  enc:
    key: yfwZM8WwHraV8LhcSNFZ7UuIpLwxpX6lthpH4CflI3U=
  hmac:
    key: SyHeAe8KeKETQihKAGFfpKipF9mysIjTsh01NaDiDpc=

jwt:
  public-key-path: classpath:keys/jwt-public.pem

JWT_SECRET: yNnC7M3ZqgV4bD0lFJm9Q2w5tSe8XpR1pWc7UjK4oHs=
JWT_PUBLIC_KEY_PATH: classpath:keys/jwt-public.pem
JWT_ACCESS_TOKEN_VALIDITY_SECONDS: 900
JWT_REFRESH_TOKEN_VALIDITY_SECONDS: 1209600

logging:
  level:
    com.example: DEBUG

common:
  notification:
    enabled: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  group-configs:
    - group: 'notification-service'
      display-name: 'Notification Service API'
      paths-to-match: '/api/**'
