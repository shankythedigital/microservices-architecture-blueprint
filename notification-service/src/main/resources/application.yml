# Notification-service (local)
server:
  port: 7072

notification:
  service:
    url: http://localhost:7072/api/notifications
  opt-out-check:
    enabled: true
  list:
    display-days: 30
    max-results: 100

asset:
  service:
    url: http://localhost:7075
  upload:
    supabase:
      enabled: false
      url: 
      service-role-key: 
      bucket: 

fileupload:
  type: standard

spring:
  application:
    name: notification-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notificationdb
        hbm2ddl:
          create_namespaces: true

auth:
  service:
    url: http://localhost:7071/api/
  client-id: notification-service
  client-secret: notify-secret

notify:
  enc:
    key: SLOqKf8lS2hidTDsXQe25ZSaoaGcczUX6gySXUxjE1M=
  hmac:
    key: krFcA7/MYPXQWbtSGMM87Dzxu2euOsRckVFeUyOC6dw=

jwt:
  public-key-path: classpath:keys/jwt-public.pem

JWT_SECRET: yNnC7M3ZqgV4bD0lFJm9Q2w5tSe8XpR1pWc7UjK4oHs=
JWT_PUBLIC_KEY_PATH: classpath:keys/jwt-public.pem
JWT_ACCESS_TOKEN_VALIDITY_SECONDS: 900
JWT_REFRESH_TOKEN_VALIDITY_SECONDS: 1209600

logging:
  level:
    com.example: DEBUG

common:
  notification:
    enabled: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  group-configs:
    - group: 'notification-service'
      display-name: 'Notification Service API'
      paths-to-match: '/api/**'
