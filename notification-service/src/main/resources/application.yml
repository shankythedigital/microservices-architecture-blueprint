# Notification-service
server:
  port: ${PORT}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL}/api/notifications
  # When true and userId + Bearer token are present, skips sending if user opted out of that channel (auth-service).
  opt-out-check:
    enabled: true
  list:
    # Number of days to display notifications in notification icons
    # Default: 30 days (notifications older than 30 days will not be shown)
    display-days: 30
    # Maximum number of notifications to return (for pagination/performance)
    max-results: 100

asset:
  service:
    url: ${ASSET_SERVICE_URL}
  upload:
    # Supabase Storage (optional). When enabled with valid url + service-role-key, uploads use Storage API;
    # filePath is stored as supabase://{bucket}/{objectKey}. When disabled, behavior is unchanged (local disk).
    supabase:
      enabled: false
      url: ${SUPABASE_IMAGES_URL}
      service-role-key: ${SUPABASE_IMAGES_SERVICE_ROLE_KEY}
      bucket: ${SUPABASE_IMAGES_BUCKET}

fileupload:
  type: standard

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # Keep app tables out of Supabase's reserved  schema (search_path / metadata clashes).
        default_schema: ${NOTIFICATION_DB_SCHEMA}
        hbm2ddl:
          create_namespaces: true

auth:
  service:
    url: ${AUTH_SERVICE_URL}/api/
  client-id: notification-service
  client-secret: notify-secret

notify:
  enc:
    key: yfwZM8WwHraV8LhcSNFZ7UuIpLwxpX6lthpH4CflI3U=
  hmac:
    key: SyHeAe8KeKETQihKAGFfpKipF9mysIjTsh01NaDiDpc=

jwt:
  public-key-path: classpath:keys/jwt-public.pem

JWT_SECRET: yNnC7M3ZqgV4bD0lFJm9Q2w5tSe8XpR1pWc7UjK4oHs=
JWT_PUBLIC_KEY_PATH: classpath:keys/jwt-public.pem
JWT_ACCESS_TOKEN_VALIDITY_SECONDS: 900
JWT_REFRESH_TOKEN_VALIDITY_SECONDS: 1209600

logging:
  level:
    com.example: DEBUG

common:
  notification:
    enabled: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  group-configs:
    - group: 'notification-service'
      display-name: 'Notification Service API'
      paths-to-match: '/api/**'
